# Example: backup topology for the portfolio operator
# Three sources, three targets, three pipelines. One of them is stale on
# purpose: the photo copy to the USB drive is on-demand, and nobody has
# plugged the drive in since August. The morning briefing reads
# _state.yaml next to this file and says so.
# Field reference: infra/backups/_template.yaml; health rules:
# infra/backups/README.md (freshness counts from last_ok, never last_run).

schema_version: 1

defaults:
  log_dir: /home/sam/logs/backup
  notify_on_failure: true

sources:
  documents:
    description: "Document archive of all three hats (invoices, tax, contracts)"
    path: "/srv/archive/documents"
    kind: directory
    sensitivity: encrypted-required   # tax and client data leave the house only encrypted
    size_hint: "~40GB"
    excludes: [".DS_Store", "*.tmp"]
  photos:
    description: "Family photo library"
    path: "/srv/archive/photos"
    kind: directory
    sensitivity: clear
    size_hint: "~600GB"
  homebox-config:
    description: "Compose files, bot state and scripts of the home server"
    path: "/home/sam/homebox-config"
    kind: directory
    sensitivity: encrypted-required
    size_hint: "~200MB"

targets:
  homebox-usb:
    description: "4 TB USB disk permanently attached to the home server"
    type: external-drive
    mount: /mnt/backup
    capabilities: [rclone-sync, restic-repo]
    enabled: true
  offsite-cloud:
    description: "Encrypted off-site repository at a storage provider"
    type: cloud
    rclone_remote: offsite
    capabilities: [restic-repo]
    enabled: true
  travel-drive:
    description: "Portable 2 TB drive kept in the desk drawer, plugged in by hand"
    type: external-drive
    mount: /media/sam/TravelDrive
    capabilities: [rclone-copy]
    enabled: true
    notes: |
      The second copy of the photos that is not in the house network.
      On-demand only, so freshness depends on someone plugging it in.

pipelines:
  - id: documents-nightly
    source: documents
    target: homebox-usb
    tool: restic-backup
    mode: scheduled
    schedule: "0 2 * * *"
    enabled: true
    tag: documents
    retention: { keep_last: 7, keep_weekly: 4, keep_monthly: 12 }
    max_age_hours: 30          # stale after a missed night plus slack

  - id: offsite-weekly
    source: homebox-config
    target: offsite-cloud
    tool: restic-backup
    mode: scheduled
    schedule: "0 3 * * 0"
    enabled: true
    tag: homebox
    retention: { keep_last: 4, keep_monthly: 6 }
    max_age_hours: 192         # a week plus a day

  - id: photos-travel-copy
    source: photos
    target: travel-drive
    tool: rclone-copy
    mode: on-demand
    enabled: true
    max_age_hours: 720         # a month; the drive is supposed to be plugged in monthly

state_file: infra/backups/_state.yaml
