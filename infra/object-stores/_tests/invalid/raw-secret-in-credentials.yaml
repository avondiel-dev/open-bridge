# REASON: the anti-pattern the ADR names first. A key in the declaration turns a
# leaked file into leaked access instead of a leaked pointer.
name: box
scope: user
backend: s3
summary: "x"
addresses: [box]
location:
  endpoint: "https://objects.example.org"
  bucket: box
credentials:
  access_key_ref: "keychain://box/access-key"
  secret_key: "a-raw-value-where-a-reference-belongs"
holds:
  - class: export
replicated: true
recovery:
  backed_up: true
