# REASON: the field is named like a reference and holds a value. Only a locator
# (scheme://...) may stand here.
name: box
scope: user
backend: s3
summary: "x"
addresses: [box]
location:
  endpoint: "https://objects.example.org"
  bucket: box
credentials:
  access_key_ref: "a-raw-value-where-a-reference-belongs"
  secret_key_ref: "keychain://box/secret-key"
holds:
  - class: export
replicated: true
recovery:
  backed_up: true
