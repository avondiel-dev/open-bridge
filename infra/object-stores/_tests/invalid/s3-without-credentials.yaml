# REASON: an S3 store nothing can open. It validated, and failed at the first
# read as a missing credential rather than as a declaration that never had one.
name: box
scope: user
backend: s3
summary: "x"
addresses: [box]
location:
  endpoint: "https://objects.example.org"
  bucket: box
holds:
  - class: export
replicated: true
recovery:
  backed_up: true
